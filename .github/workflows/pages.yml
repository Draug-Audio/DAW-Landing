# Build strony (Vite) i publikacja na GitHub Pages.
# `base: './'` w vite.config.js sprawia, że ścieżki są względne, więc strona
# działa pod adresem projektu (/DAW-Landing/) bez dodatkowej konfiguracji.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# jeden deploy naraz; kolejny push czeka, zamiast wyścigu
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bez `npm ci` — package-lock.json jest w .gitignore
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
